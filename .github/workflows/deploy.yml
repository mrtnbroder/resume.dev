name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # Project sites (repo != <owner>.github.io) are served under /<repo>;
      # user sites and custom domains live at the root. astro.config.mjs picks
      # these up as `site` and `base`.
      - name: Compute Pages site and base path
        id: pages
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == *.github.io ]]; then
            echo "site=https://$repo" >> "$GITHUB_OUTPUT"
            echo "base=" >> "$GITHUB_OUTPUT"
          else
            echo "site=https://$owner.github.io" >> "$GITHUB_OUTPUT"
            echo "base=/$repo" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: bun run build
        env:
          SITE_URL: ${{ steps.pages.outputs.site }}
          BASE_PATH: ${{ steps.pages.outputs.base }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
